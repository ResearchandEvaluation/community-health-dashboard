name: Publish dashboard (no data pull)

# Rebuilds and publishes the page from the data already saved in the repository.
# Runs when resources.json, the page template, or the scripts change, and every Monday.
on:
  push:
    branches: [main]
    paths: ["site/**", "data/manual/**", "build/**", ".github/workflows/publish.yml"]
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 build/check_data.py
      - run: python3 build/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
