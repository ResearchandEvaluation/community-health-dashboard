name: Refresh data and publish dashboard

on:
  schedule:
    # Quarterly, on the 15th of February, May, August, and November at 14:00 UTC (6 or 7 am Pacific)
    - cron: "0 14 15 2,5,8,11 *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Space-separated script names to run (leave empty for all)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pull data from every source
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python3 scripts/run_all.py ${{ github.event.inputs.sources }}
      - name: Check the data
        run: python3 build/check_data.py
      - name: Build the page
        run: python3 build/build_site.py
      - name: Save the refreshed data to the repository
        run: |
          git config user.name "dashboard-refresh"
          git config user.email "dashboard-refresh@users.noreply.github.com"
          git add data/out
          git diff --cached --quiet || git commit -m "Data refresh $(date -u +%Y-%m-%d)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
