name: Pull Healthy Places Index data

# Run by hand from the Actions tab. Pulls HPI data with the HPI_API_KEY secret and saves it to data/out.
# Does not rebuild or publish the page.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Pull HPI data
        env:
          HPI_API_KEY: ${{ secrets.HPI_API_KEY }}
        run: python3 scripts/hpi.py
      - name: Save the HPI data to the repository
        run: |
          git config user.name "dashboard-refresh"
          git config user.email "dashboard-refresh@users.noreply.github.com"
          git add data/out/hpi_*.json
          git diff --cached --quiet || git commit -m "HPI data pull $(date -u +%Y-%m-%d)"
          git push
