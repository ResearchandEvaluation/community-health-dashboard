<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Community Health Data Dashboard | Population Health Innovation Lab</title>
<meta name="description" content="Public data on health needs and services in the California counties where PHIL works, alongside PHIL's work with community partners.">
<link rel="icon" href="assets/phil-mark.png">
<style>
.phil-tool[open]{grid-column:1 / -1}.phil-tool>summary::-webkit-details-marker{display:none}.phil-tool[open]>summary .phil-tool-open{display:none}.phil-tool>summary:hover{color:#02784d}

html,body{height:100%}body{margin:0;overflow:hidden;background:#ffffff;color:#12365b;font-family:"Avenir Next LT Pro","Avenir Next",Avenir,Arial,Helvetica,sans-serif}
a{color:#496b9c}a:hover{color:#12365b}
button:focus-visible{outline:2px solid #12365b;outline-offset:2px}
.phil-dot{width:44px;height:44px;border:none;border-radius:50%;background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.phil-dot span{display:block;width:14px;height:14px;border-radius:50%;background:#02784d;transition:transform .15s}
.phil-dot:hover{background:#f3e9d7}
.phil-dot:hover span{transform:scale(1.3)}
.phil-map path[data-on="1"]:hover{fill:#02784d}
@media (max-width: 700px){.phil-nav{flex-wrap:nowrap !important;overflow-x:auto;padding-bottom:6px}.phil-nav button,.phil-nav span{flex-shrink:0;white-space:nowrap}.phil-navrow{flex-wrap:nowrap !important}}
@media print{nav,.phil-noprint,header{display:none !important}#phil-dash-scroll{height:auto !important;overflow:visible !important}main{padding:0 !important;max-width:none !important}.phil-print-only{display:block !important}body{background:#ffffff !important}.phil-prow{break-inside:avoid}h3{break-after:avoid}}
.phil-print-only{display:none}
</style>
<style>.phil-loading{font-family:Arial,sans-serif;padding:40px;color:#12365b}</style>
</head>
<body>
<div id="phil-root"><div class="phil-loading">Loading the Community Health Data Dashboard…</div></div>
<script type="text/template" id="phil-template">
<div id="phil-dash-scroll" style="height: 100vh; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; background: #ffffff; color: #12365b; font-family: 'Avenir Next LT Pro', 'Avenir Next', Avenir, Arial, Helvetica, sans-serif">
<div style="background: #ffffff; border-bottom: 1px solid #dee3e8; padding: 20px 24px">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between">
<a href="https://pophealthinnovationlab.org/" style="display: inline-flex; padding: 8px 0"><img src="assets/phil-logo.png" alt="Population Health Innovation Lab, a program of the Public Health Institute" style="height: 104px; width: auto; max-width: none; display: block; margin: -17px 0 -21px -20px"></a>
<div style="display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center"><a href="mailto:research@pophealthinnovationlab.org?subject=Community%20Health%20Data%20Dashboard%20feedback&body=Which%20of%20these%20measures%20would%20you%20use%20in%20your%20next%20community%20health%20assessment%2C%20improvement%20plan%2C%20or%20BHSA%20Integrated%20Plan%3F%20What%20is%20missing%3F%0A%0AYour%20county%20and%20organization%3A%20%0A%0AYour%20answer%3A%20" style="min-height: 40px; display: inline-flex; align-items: center; padding: 8px 16px; border-radius: 999px; background: #02784d; color: #ffffff; font-size: 14px; font-weight: 600; text-decoration: none">Share feedback</a></div>
</div>
</div>
<header style="background: #12365b; color: #ffffff; padding: 26px 24px 22px">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px">
<h1 style="margin: 0; font-family: Archer, Georgia, Cambria, serif; font-size: 34px; line-height: 1.15; font-weight: 700; color: #ffffff">Community Health Data Dashboard</h1>
<p style="margin: 0; max-width: 820px; font-size: 16px; line-height: 1.45; color: #f3e9d7">Public data on health needs in the California communities the Population Health Innovation Lab (PHIL) serves, alongside how PHIL and its partners are working to improve health in each community.</p>
</div>
</header>
<nav aria-label="Dashboard sections" style="background: #f3e9d7; border-bottom: 1px solid #dee3e8; padding: 12px 24px">
<div class="phil-nav" style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="phil-county" style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #30718d; padding-left: 4px">County</label><select id="phil-county" onChange="{{nav.pickCounty}}" aria-label="Choose a county. Every page shows this county." style="{{nav.selectStyle}}"><option value="{{nav.cur}}">{{nav.curLabel}}</option></select></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #30718d; padding-left: 4px">Start here</span><div class="phil-navrow" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{tabsHome}}" as="t" hint-placeholder-count="1">
<button type="button" onClick="{{t.pick}}" aria-current="{{t.current}}" title="{{t.label}}" style="{{t.style}}">{{t.navLabel}}</button>
</sc-for>
</div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #30718d; padding-left: 4px">Health topics</span><div class="phil-navrow" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{tabsTopics}}" as="t" hint-placeholder-count="5">
<button type="button" onClick="{{t.pick}}" aria-current="{{t.current}}" title="{{t.label}}" style="{{t.style}}">{{t.navLabel}}</button>
</sc-for>
</div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #30718d; padding-left: 4px">Care and Coverage</span><div class="phil-navrow" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{tabsServices}}" as="t" hint-placeholder-count="2">
<button type="button" onClick="{{t.pick}}" aria-current="{{t.current}}" title="{{t.label}}" style="{{t.style}}">{{t.navLabel}}</button>
</sc-for>
</div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #30718d; padding-left: 4px">Planning (pilot)</span><div class="phil-navrow" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{tabsPlanning}}" as="t" hint-placeholder-count="1">
<button type="button" onClick="{{t.pick}}" aria-current="{{t.current}}" title="{{t.label}}" style="{{t.style}}">{{t.navLabel}}</button>
</sc-for>
</div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #30718d; padding-left: 4px">More</span><div class="phil-navrow" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{tabsMore}}" as="t" hint-placeholder-count="1">
<button type="button" onClick="{{t.pick}}" aria-current="{{t.current}}" title="{{t.label}}" style="{{t.style}}">{{t.navLabel}}</button>
</sc-for>
</div></div>
</div>
</nav>
<sc-if value="{{find.show}}" hint-placeholder-val="{{true}}">
<div class="phil-noprint" style="background: #ffffff; border-bottom: 1px solid #dee3e8; padding: 12px 24px">
<form onSubmit="{{find.submit}}" style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center">
<label for="phil-find" style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #30718d; white-space: nowrap">Find data</label>
<input id="phil-find" type="search" name="q" value="{{find.q}}" autocomplete="off" placeholder="Try: stroke, youth mental health, housing, foster care, BHSA" aria-label="Find data on this dashboard" style="flex: 1 1 320px; min-width: 0; min-height: 42px; padding: 8px 14px; border: 1px solid #73889e; border-radius: 999px; font-family: inherit; font-size: 15px; color: #12365b; background: #ffffff">
<button type="submit" style="min-height: 42px; padding: 8px 18px; border-radius: 999px; border: none; background: #12365b; color: #ffffff; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Search</button>
<button id="phil-find-clear" type="button" onClick="{{find.clear}}" style="display: none; min-height: 42px; padding: 8px 14px; border-radius: 999px; border: 1px solid #c9d3dd; background: #ffffff; color: #12365b; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Clear</button>
</form>
</div>
</sc-if>
<main style="max-width: 1200px; margin: 0 auto; padding: 40px 24px 64px; display: flex; flex-direction: column; gap: 48px">
<sc-if value="{{tkBack.show}}" hint-placeholder-val="{{false}}"><div class="phil-noprint" style="background: #f3e9d7; border-radius: 10px; padding: 12px 18px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center"><button type="button" onClick="{{tkBack.pick}}" style="min-height: 40px; padding: 6px 14px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; background: #12365b; color: #ffffff; border: 1px solid #12365b">Back to the CHA and CHIP Planning Toolkit</button><span style="font-size: 13.5px; color: #24384d">You opened this page from the toolkit.</span></div></sc-if>
<div id="phil-find-panel" class="phil-noprint" style="display: none"></div>

<sc-if value="{{showOverview}}" hint-placeholder-val="{{true}}">
<section style="display: flex; flex-direction: column; gap: 48px">

<div style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-family: Archer, Georgia, Cambria, serif; font-size: 28px; color: #039862">{{ov.pickTitle}}</h2>
<div style="display: flex; flex-wrap: wrap; gap: 20px 36px; align-items: flex-start">
<div class="phil-map" aria-hidden="true" style="position: relative; flex: 0 1 380px; min-width: 260px; max-width: 100%">
<svg viewBox="0 0 300 330" style="width: 100%; height: auto; display: block">
<sc-for list="{{map.counties}}" as="mc" hint-placeholder-count="58"><path d="{{mc.d}}" fill="{{mc.fill}}" stroke="#ffffff" stroke-width="0.8" data-on="{{mc.on}}" style="{{mc.style}}" onClick="{{mc.pick}}"><title>{{mc.title}}</title></path></sc-for>
<sc-for list="{{map.leaders}}" as="ln" hint-placeholder-count="12"><line x1="{{ln.x1}}" y1="{{ln.y1}}" x2="{{ln.x2}}" y2="{{ln.y2}}" stroke="#526c87" stroke-width="0.6"></line></sc-for>
</svg>
<sc-for list="{{map.labels}}" as="lb" hint-placeholder-count="18"><span style="{{lb.style}}">{{lb.name}}</span></sc-for>
<div style="font-size: 12px; color: #526c87; margin-top: 4px">Select a county on the map or from the list. Shaded counties are on this dashboard.</div>
</div>
<div style="flex: 1 1 360px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{ov.counties}}" as="c" hint-placeholder-count="18">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" aria-label="{{c.aria}}" style="{{c.style}}">{{c.name}}</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #30718d">How to read the colors</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: #3d556e">
<span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 50%; background: #fbd5d2; border: 1px solid #b42318; display: inline-block"></span>Worse than California average</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 50%; background: #d3f0df; border: 1px solid #02784d; display: inline-block"></span>Better than California average</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 50%; background: #e8edf2; border: 1px solid #73889e; display: inline-block"></span>No California comparison, or same as the California average</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 28px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #e3f1f8, #8cc9e4 50%, #2a7fa8); display: inline-block"></span>All California counties, lowest to highest</span>
</div>
</div>
</div>
</div>
</div>

<sc-if value="{{hasCounty}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-family: Archer, Georgia, Cambria, serif; font-size: 28px; color: #039862">{{ov.countyLabel}} at a Glance</h2>
<p style="margin: 0; font-size: 17px; font-weight: 600; line-height: 1.5; color: #12365b">A few headline measures. Select any card to open its topic page with the full set of measures, trends, and sources.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px">
<sc-for list="{{ov.snapshot}}" as="k" hint-placeholder-count="6">
<button type="button" onClick="{{k.pick}}" style="text-align: left; font-family: inherit; color: #12365b; cursor: pointer; background: #ffffff; border: 1px solid #dee3e8; border-radius: 10px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: #30718d">{{k.topic}}</span>
<span style="font-size: 15px; line-height: 1.35; font-weight: 700">{{k.label}}</span>
<span style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px">
<span style="font-family: Archer, Georgia, Cambria, serif; font-size: 34px; font-weight: 700; line-height: 1.1; color: #12365b">{{k.value}}</span>
<sc-if value="{{k.hasPill}}" hint-placeholder-val="{{true}}"><span style="{{k.pillStyle}}">{{k.pill}}</span></sc-if>
</span>
<sc-if value="{{k.isBars}}" hint-placeholder-val="{{true}}">
<span style="display: flex; flex-direction: column; gap: 6px; width: 100%">
<sc-for list="{{k.bars}}" as="b" hint-placeholder-count="2">
<span style="display: grid; grid-template-columns: 96px 1fr 56px; align-items: center; gap: 8px; font-size: 12px">
<span style="color: #3d556e">{{b.label}}</span>
<span style="display: block; height: 12px; background: #f4f6f8; border-radius: 4px; overflow: hidden"><span style="{{b.style}}"></span></span>
<span style="text-align: right; font-weight: 600">{{b.value}}</span>
</span>
</sc-for>
</span>
</sc-if>
<sc-if value="{{k.isRank}}" hint-placeholder-val="{{false}}">
<span style="display: flex; flex-direction: column; gap: 4px; width: 100%">
<span style="position: relative; display: block; height: 26px; margin: 0 10px" aria-hidden="true">
<span style="position: absolute; left: -6px; right: -6px; top: 9px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #e3f1f8, #8cc9e4 50%, #2a7fa8)"></span>
<sc-for list="{{k.dots}}" as="dt" hint-placeholder-count="58"><span style="{{dt.style}}"></span></sc-for>
</span>
<span style="display: flex; justify-content: space-between; font-size: 12px; color: #526c87"><span>{{k.rankLow}}</span><span>{{k.rankHigh}}</span></span>
</span>
</sc-if>
<span style="margin-top: auto; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; align-items: baseline"><span style="font-size: 12px; color: #526c87">{{k.period}}</span><span style="font-size: 13px; font-weight: 600; color: #496b9c; text-decoration: underline">Open {{k.topic}}</span></span>
</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-family: Archer, Georgia, Cambria, serif; font-size: 28px; color: #039862">What Would You Like to Do?</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px">
<button type="button" onClick="{{ov.goTopics}}" style="text-align: left; border: none; cursor: pointer; font-family: inherit; width: 100%; background: #12365b; color: #ffffff; border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 8px; min-height: 140px">
<span style="font-family: Archer, Georgia, Cambria, serif; font-size: 22px; font-weight: 700; color: #ffffff">Explore Health Data by Topic</span>
<span style="font-size: 15px; line-height: 1.45; color: #f3e9d7">Five health topics, from cardiovascular health to substance use and homelessness, with county data and trends.</span>
</button>
<button type="button" onClick="{{ov.goEcm}}" style="text-align: left; border: none; cursor: pointer; font-family: inherit; background: #02784d; color: #ffffff; border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 8px; min-height: 140px">
<span style="font-family: Archer, Georgia, Cambria, serif; font-size: 22px; font-weight: 700; color: #ffffff">Care and Coverage</span>
<span style="font-size: 15px; line-height: 1.45; color: #ffffff">{{ov.ecmLine}}</span>
</button>
<button type="button" onClick="{{ov.goPhil}}" style="text-align: left; border: none; cursor: pointer; font-family: inherit; width: 100%; background: #f3e9d7; color: #12365b; border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 8px; min-height: 140px">
<span style="font-family: Archer, Georgia, Cambria, serif; font-size: 22px; font-weight: 700; color: #12365b">PHIL in the {{ov.countyLabel}} Community</span>
<span style="font-size: 15px; line-height: 1.45; color: #12365b">{{ov.philLine}}</span>
</button>
</div>
</div>

</sc-if>

<div style="background: #f3e9d7; border-radius: 10px; padding: 24px 28px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: center">
<img src="assets/fox-welcome.png" alt="PHIL's fox mascot with arms open in welcome" style="height: 96px; width: auto; flex-shrink: 0">
<div style="flex: 1 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-family: Archer, Georgia, Cambria, serif; font-size: 30px; line-height: 1.2; color: #039862">About This Dashboard</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.55; color: #12365b">This dashboard shares public data on health needs and services in the California counties where PHIL works. It supports local planning, grant writing, program design, and cross-sector conversations for PHIL's partners and every organization working in these counties.</p>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px">
<div style="background: #ffffff; border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.5; color: #12365b"><h3 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #30718d">Why These Counties</h3>
<p style="margin: 0">These are the counties, mostly rural and in Northern California, where PHIL works with community-based organizations, Tribes, health systems, Medi-Cal managed care plans, and county agencies to build collaboratives and lasting systems change. Alameda County is home to the Public Health Institute, PHIL's parent organization. PHIL brings research, evaluation, facilitation, and data. Partners bring local knowledge and leadership.</p>
</div>
<div style="background: #ffffff; border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.5; color: #12365b"><h3 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #30718d">Connected Through Medi-Cal</h3>
<p style="margin: 0">Under California Advancing and Innovating Medi-Cal (CalAIM), plans, providers, counties, and Tribes share responsibility for members' health. The dashboard places county health data beside Medi-Cal coverage, Enhanced Care Management (ECM), and Community Supports.</p>
</div>
<div style="background: #ffffff; border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.5; color: #12365b"><h3 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #30718d">What It Covers</h3>
<ul style="margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 2px">
<li>Cardiovascular health</li>
<li>Adverse childhood experiences (ACEs) and trauma</li>
<li>Maternal and early childhood behavioral health</li>
<li>Youth behavioral health</li>
<li>Substance use and homelessness</li>
<li>Care and coverage: county BHSA plans, access to care, Medi-Cal, ECM, and Community Supports</li>
</ul>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; align-items: start">
<div style="background: #ffffff; border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
<h3 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #30718d">How to Use It</h3>
<ol style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 15px; line-height: 1.45; color: #12365b">
<li><span style="font-weight: 600">Choose your county.</span> It stays selected on every page.</li>
<li><span style="font-weight: 600">Review headline measures</span> compared with California.</li>
<li><span style="font-weight: 600">Open a health topic</span> for indicators, trends, and PHIL's projects.</li>
<li><span style="font-weight: 600">Open Care and Coverage</span> for county Behavioral Health Services Act (BHSA) plans, access to care, Medi-Cal, ECM, and Community Supports.</li>
<li><span style="font-weight: 600">See how PHIL works</span> in your community and how to connect.</li>
<li><span style="font-weight: 600">Open Resources</span> for state dashboards, PHIL toolkits, and data sources.</li>
<li><span style="font-weight: 600">Planning a community health assessment or Behavioral Health Services Act (BHSA) Integrated Plan?</span> <button type="button" onClick="{{ov.goPlan}}" style="padding: 0; border: none; background: transparent; color: #496b9c; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; text-decoration: underline">See how PHIL can help</button>.</li>
</ol>
</div>
<div style="background: #ffffff; border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.5; color: #12365b"><h3 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #30718d">Who It Is For</h3>
<ul style="margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 2px">
<li>Community-based organizations and Tribal partners</li>
<li>Clinics, hospitals, and Medi-Cal managed care plans</li>
<li>ECM and Community Supports providers</li>
<li>County public health and behavioral health departments</li>
<li>Funders, policymakers, and PHIL collaboratives</li>
</ul>
</div>
</div>

<li>{{sourceSummary}}</li>
<li>Every value is published by its data source. PHIL does not calculate its own rates or statewide figures.</li>
<li>PHIL ranks the published county values from highest to lowest, and marks whether a higher value is better or worse for each measure. These rankings and colors are the only things PHIL adds.</li>
<li>Census estimates come from a survey and are published with a margin of error, shown as ±. The true value is likely within that range.</li>
<li>What each card shows depends on what its source publishes:
<ul style="margin: 4px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 2px">
<li><span style="font-weight: 600">Compared with California</span> when the same dataset publishes a statewide value.</li>
<li><span style="font-weight: 600">Rank among California counties</span> when the source publishes all 58 counties.</li>
<li><span style="font-weight: 600">Quarter</span> when the source skips some counties.</li>
<li><span style="font-weight: 600">Trend</span> when the source publishes more than one period.</li>
</ul>
A card with none of these shows the county's value alone.</li>
<li>"Suppressed" means the publisher withheld a small number to protect privacy. Some publishers report small counties as a combined group, and the dashboard shows those groups as published.</li>
<li>Each chart shows the years its data covers. The dashboard updates on a regular schedule as publishers release new data.</li>
</ul>

<h2 style="margin: 0; font-family: Archer, Georgia, Cambria, serif; font-size: 34px; line-height: 1.2; color: #039862">Enhanced Care Management (ECM) and Community Supports</h2>
<p style="margin: 0; max-width: 880px; font-size: 16px; line-height: 1.55">ECM and Community Supports are Medi-Cal benefits under California Advancing and Innovating Medi-Cal (CalAIM). Medi-Cal managed care plans deliver them through contracts with community providers. Choose a county to see which Community Supports each plan offers, how many provider contracts support each service, and how many members each benefit reaches.</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; background: #e6f5ec; border: 1px solid #b5dfc6; border-radius: 10px; padding: 12px 18px; font-size: 15px; line-height: 1.5; color: #12365b"><span>ECM and Community Supports providers: Medi-Cal coverage, provider shortage areas, preventable hospital stays, and other access measures for this county are on the Access to Care page.</span><button type="button" onClick="{{ecm.goMedi}}" style="min-height: 40px; padding: 6px 16px; border-radius: 999px; border: 1px solid #02784d; background: #ffffff; color: #02784d; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Open Access to Care</button></div>

<sc-if value="{{noCounty}}" hint-placeholder-val="{{false}}">
<div style="border: 2px dashed #73889e; border-radius: 10px; padding: 24px 28px; background: #f8fafb; display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 17px; font-weight: 700; color: #12365b">Choose a county to see its plans, provider contracts, and members served.</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{nav.chips}}" as="c" hint-placeholder-count="18">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" aria-label="{{c.aria}}" style="{{c.style}}">{{c.name}}</button>
</sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{hasCounty}}" hint-placeholder-val="{{true}}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">
<sc-for list="{{ecm.tiles}}" as="k" hint-placeholder-count="4">
<div style="background: #ffffff; border: 1px solid #dee3e8; border-top: 4px solid #02784d; border-radius: 8px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px">
<div style="font-family: Archer, Georgia, Cambria, serif; font-size: 34px; font-weight: 700; line-height: 1.1; color: #12365b">{{k.value}}</div>
<div style="font-size: 14px; line-height: 1.4; color: #3d556e">{{k.label}}</div>
</div>
</sc-for>
</div>

<div style="background: #ffffff; border: 1px solid #dee3e8; border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h3 style="margin: 0; font-family: Archer, Georgia, Cambria, serif; font-size: 24px; color: #12365b">Community Supports Available in {{ecm.countyLabel}}</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #3d556e">A service is available when a plan has at least one contracted provider for it in the county, {{ecm.contractsAsOf}}, as reported by DHCS. Bars show provider contracts across all plans in the county.</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 20px; font-size: 13px; color: #3d556e">
<span style="display: inline-flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #02784d; display: inline-block"></span>Contracted providers</span>
<span style="display: inline-flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #dee3e8; display: inline-block"></span>No contracted providers</span>
</div>
<div style="overflow-x: auto">
<table style="border-collapse: collapse; width: 100%; min-width: 720px; font-size: 14px">
<thead>
<tr>
<th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 2px solid #12365b; color: #12365b">Community Support</th>
<sc-for list="{{ecm.plans}}" as="p" hint-placeholder-count="2">
<th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 2px solid #12365b; color: #12365b; min-width: 150px">{{p.name}}</th>
</sc-for>
<th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 2px solid #12365b; color: #12365b; min-width: 200px">Provider contracts, all plans</th>
</tr>
</thead>
<tbody>
<sc-for list="{{ecm.services}}" as="s" hint-placeholder-count="14">
<tr>
<th scope="row" style="text-align: left; font-weight: 600; padding: 10px 12px; border-bottom: 1px solid #dee3e8; color: #12365b">{{s.name}}</th>
<sc-for list="{{s.cells}}" as="x" hint-placeholder-count="2">
<td style="padding: 10px 12px; border-bottom: 1px solid #dee3e8" title="{{x.title}}">
<span style="display: inline-flex; align-items: center; gap: 8px">
<span aria-hidden="true" style="{{x.dotStyle}}"></span>
<span style="{{x.textStyle}}">{{x.text}}</span>
</span>
</td>
</sc-for>
<td style="padding: 10px 12px; border-bottom: 1px solid #dee3e8" title="{{s.barTitle}}">
<div style="display: flex; align-items: center; gap: 8px">
<div style="flex: 1 1 auto; height: 14px; background: #f4f6f8; border-radius: 4px; overflow: hidden"><div style="{{s.barStyle}}"></div></div>
<span style="min-width: 36px; text-align: right; font-weight: 600; color: #12365b">{{s.total}}</span>
</div>
</td>
</tr>
</sc-for>
</tbody>
</table>
</div>
<sc-if value="{{ecm.hasPending}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; font-size: 13px; color: #3d556e">{{ecm.pendingNote}}</p>
</sc-if>
<p style="margin: 0; font-size: 13px; color: #3d556e">Short-Term Post-Hospitalization Housing ends December 31, 2026. A provider contract count reflects contracts between a plan and providers, and one provider can hold contracts for several services.</p>
</div>

<div style="background: #ffffff; border: 1px solid #dee3e8; border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h3 style="margin: 0; font-family: Archer, Georgia, Cambria, serif; font-size: 24px; color: #12365b">Who Is Being Served in {{ecm.countyLabel}}</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #3d556e">Members who used each Community Support, and members enrolled in ECM by Population of Focus, {{ecm.useQuarter}}. DHCS reports these counts for each health plan. Hover over a bar to see the four most recent quarters.</p>
</div>
<sc-if value="{{ecm.useMultiPlan}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #30718d">Health plan</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{ecm.usePlans}}" as="p" hint-placeholder-count="2">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="{{p.style}}">{{p.name}}</button>
</sc-for>
</div>
</div>
</sc-if>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 32px">
<sc-for list="{{ecm.useCharts}}" as="g" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 10px">
<h4 style="margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #30718d">{{g.title}}</h4>
<sc-if value="{{g.empty}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; font-size: 14px; color: #526c87">{{g.emptyText}}</p>
</sc-if>
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="10">
<div style="display: flex; flex-direction: column; gap: 4px" title="{{r.title}}">
<div style="display: flex; justify-content: space-between; gap: 12px; font-size: 14px"><span style="color: #12365b">{{r.label}}</span><span style="{{r.valueStyle}}">{{r.value}}</span></div>
<div style="height: 12px; background: #f4f6f8; border-radius: 4px; overflow: hidden"><div style="{{r.barStyle}}"></div></div>
</div>
</sc-for>
</div>
</sc-for>
</div>
<p style="margin: 0; font-size: 13px; color: #3d556e">"Suppressed" marks a small count DHCS withheld to protect member privacy. A member can use more than one Community Support, and ECM members are counted in each Population of Focus they qualify for.</p>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px">
<sc-for list="{{ecm.compare}}" as="g" hint-placeholder-count="2">
<div style="background: #ffffff; border: 1px solid #dee3e8; border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<h3 style="margin: 0; font-family: Archer, Georgia, Cambria, serif; font-size: 22px; color: #12365b">{{g.title}}</h3>
<p style="margin: 0; font-size: 13px; color: #3d556e">{{g.sub}}</p>
<div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px">
<span style="font-family: Archer, Georgia, Cambria, serif; font-size: 40px; font-weight: 700; line-height: 1.1; color: #02784d">{{g.big}}</span>
<span style="font-size: 14px; color: #3d556e">{{g.unit}}</span>
</div>
<div style="font-size: 14px; color: #12365b">{{g.side}}</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="position: relative; height: 26px; margin: 0 10px" aria-hidden="true">
<div style="position: absolute; left: -6px; right: -6px; top: 9px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #e3f1f8, #8cc9e4 50%, #2a7fa8)"></div>
<sc-for list="{{g.dots}}" as="dt" hint-placeholder-count="58"><span style="{{dt.style}}"></span></sc-for>
</div>
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #526c87"><span>{{g.rankLow}}</span><span>{{g.rankHigh}}</span></div>
<div style="font-size: 13px; color: #12365b">{{g.rankText}}</div>
</div>
<p style="margin: 0; font-size: 13px; color: #3d556e">{{g.note}}</p>
</div>
</sc-for>
</div>

<div style="background: #ffffff; border: 1px solid #dee3e8; border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h3 style="margin: 0; font-family: Archer, Georgia, Cambria, serif; font-size: 24px; color: #12365b">ECM Provider Contracts by Population of Focus in {{ecm.countyLabel}}</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #3d556e">ECM provider contracts across all plans in the county, {{ecm.pofAsOf}}. A population with no contracts has no ECM provider contracted to serve it in that quarter.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 28px">
<sc-for list="{{ecm.pofGroups}}" as="g" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 12px">
<h4 style="margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #30718d">{{g.name}}</h4>
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="7">
<div style="display: flex; flex-direction: column; gap: 4px" title="{{r.title}}">
<div style="display: flex; justify-content: space-between; gap: 12px; font-size: 14px"><span style="color: #12365b">{{r.label}}</span><span style="font-weight: 600; color: #12365b; white-space: nowrap">{{r.value}}</span></div>
<div style="height: 12px; background: #f4f6f8; border-radius: 4px; overflow: hidden"><div style="{{r.barStyle}}"></div></div>
</div>
</sc-for>
</div>
</sc-for>
</div>
</div>

<div style="background: #ffffff; border: 1px solid #dee3e8; border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h3 style="margin: 0; font-family: Archer, Georgia, Cambria, serif; font-size: 24px; color: #12365b">Members Served by Each Health Plan</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #3d556e">{{ecm.periodLabel}}. "Suppressed" marks a small count DHCS withheld to protect member privacy.</p>
</div>
<div style="overflow-x: auto">
<table style="border-collapse: collapse; width: 100%; min-width: 760px; font-size: 14px">
<thead><tr>
<th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 2px solid #12365b">Health plan</th>
<th scope="col" style="text-align: right; padding: 10px 12px; border-bottom: 2px solid #12365b">Average plan members, {{ecm.periodYear}}</th>
<th scope="col" style="text-align: right; padding: 10px 12px; border-bottom: 2px solid #12365b">Enrollment, {{ecm.enrollMonth}}</th>
<th scope="col" style="text-align: right; padding: 10px 12px; border-bottom: 2px solid #12365b">Members who used Community Supports</th>
<th scope="col" style="text-align: right; padding: 10px 12px; border-bottom: 2px solid #12365b">Community Supports services used per 10,000 members</th>
<th scope="col" style="text-align: right; padding: 10px 12px; border-bottom: 2px solid #12365b">Members who received ECM</th>
<th scope="col" style="text-align: right; padding: 10px 12px; border-bottom: 2px solid #12365b">Share of plan members in ECM</th>
</tr></thead>
<tbody>
<sc-for list="{{ecm.planRows}}" as="r" hint-placeholder-count="2">
<tr>
<th scope="row" style="text-align: left; font-weight: 600; padding: 10px 12px; border-bottom: 1px solid #dee3e8">{{r.plan}}</th>
<td style="text-align: right; padding: 10px 12px; border-bottom: 1px solid #dee3e8">{{r.avg}}</td>
<td style="text-align: right; padding: 10px 12px; border-bottom: 1px solid #dee3e8">{{r.enroll}}</td>
<td style="text-align: right; padding: 10px 12px; border-bottom: 1px solid #dee3e8">{{r.csMembers}}</td>
<td style="text-align: right; padding: 10px 12px; border-bottom: 1px solid #dee3e8">{{r.csRate}}</td>
<td style="text-align: right; padding: 10px 12px; border-bottom: 1px solid #dee3e8">{{r.ecmMembers}}</td>
<td style="text-align: right; padding: 10px 12px; border-bottom: 1px solid #dee3e8">{{r.ecmPct}}</td>
</tr>
</sc-for>
</tbody>
</table>
</div>
</div>

<div style="background: #f3e9d7; border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; line-height: 1.55">
<div style="font-weight: 600; font-size: 16px">More ECM and Community Supports Data</div>
<p style="margin: 0">Longer quarterly trends, member demographics, and statewide totals are in the <a href="https://storymaps.arcgis.com/collections/a07f998dfefa497fbd7613981e4f6117?item=4">DHCS ECM and Community Supports Quarterly Implementation Report</a>.</p>
<p style="margin: 0">Sources: <a href="https://data.chhs.ca.gov/dataset/ecm-community-support-data-tables-for-quarterly-implementation-report">ECM and Community Supports Data Tables for the Quarterly Implementation Report</a> (Charts 4.5.2, 3.9.1, 3.9.3, 2.5.2, 1.7.1, and 1.7.3), California Department of Health Care Services (DHCS), California Health and Human Services Open Data Portal; <a href="https://www.dhcs.ca.gov/Documents/MCQMD/Community-Supports-Elections-by-MCP-and-County.pdf">CalAIM Community Supports Managed Care Plan Elections</a>, DHCS, updated June 2026. County figures and statewide totals are published by DHCS (Charts 1.5 and 3.7, and the implementation report totals table).</p>
</div>
</sc-if>
</section>
</sc-if>

<sc-if value="{{showProfile}}" hint-placeholder-val="{{false}}">
<section style="display: flex; flex-direction: column; gap: 24px">
<div class="phil-noprint" style="display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center">
<img src="assets/fox-clipboard.png" alt="PHIL's fox mascot reviewing a clipboard" style="height: 96px; width: auto; flex-shrink: 0">
<div style="display: flex; flex-direction: column; gap: 8px; flex: 1 1 480px; min-width: 0">
<h2 style="margin: 0; font-family: Archer, Georgia, Cambria, serif; font-size: 34px; line-height: 1.2; color: #039862">Print Your County Profile</h2>
<p style="margin: 0; max-width: 820px; font-size: 16px; line-height: 1.55">The measures on this dashboard for the county chosen in the County menu, on printable pages. Choose the topics you need. Use it for planning meetings, community health assessments, or a Data Walk.</p>
</div>
</div>
<div class="phil-noprint" style="display: flex; flex-direction: column; gap: 10px">
<h3 style="margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #30718d">Topics to Include</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #3d556e">Select the topics you need, then remove any single measure with the Remove button on its row. The PDF includes only what is shown.</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" onClick="{{prof.pickAll}}" aria-pressed="{{prof.allPressed}}" style="{{prof.allStyle}}">All topics</button>
<sc-for list="{{prof.topics}}" as="pt" hint-placeholder-count="7"><button type="button" onClick="{{pt.pick}}" aria-pressed="{{pt.pressed}}" style="{{pt.style}}">{{pt.name}}</button></sc-for>
<button type="button" onClick="{{prof.pickNone}}" style="min-height: 40px; padding: 6px 14px; border: none; background: transparent; color: #496b9c; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: underline">Clear all</button>
</div>
</div>
<sc-if value="{{prof.noCounty}}" hint-placeholder-val="{{false}}">
<div style="border: 2px dashed #73889e; border-radius: 10px; padding: 24px 28px; background: #f8fafb; display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 17px; font-weight: 700; color: #12365b">Choose a county to build its profile.</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{nav.chips}}" as="c" hint-placeholder-count="18">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" aria-label="{{c.aria}}" style="{{c.style}}">{{c.name}}</button>
</sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{prof.hasCounty}}" hint-placeholder-val="{{true}}">
<div class="phil-noprint" style="display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; background: #e6f5ec; border: 1px solid #b5dfc6; border-radius: 12px; padding: 16px 20px">
<button type="button" onClick="{{prof.doPrint}}" style="min-height: 48px; padding: 10px 22px; border-radius: 999px; border: none; background: #12365b; color: #ffffff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Print or save as PDF</button>
<span style="font-size: 14px; line-height: 1.5; color: #24384d">If the button does nothing, use your browser's Print command (Cmd + P on a Mac, Ctrl + P on Windows) and choose Save as PDF.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; border-bottom: 3px solid #12365b; padding-bottom: 12px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #039862">Community Health Data Dashboard</span>
<h2 style="margin: 0; font-family: Archer, Georgia, Cambria, serif; font-size: 32px; color: #12365b">{{prof.countyLabel}} Profile</h2>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #3d556e">Population Health Innovation Lab (PHIL), a program of the Public Health Institute. All values are published by their sources. Full sources and notes: dashboard.pophealthinnovationlab.org</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; background: #fbf4e6; border: 1px solid #ead9b8; border-radius: 10px; padding: 14px 18px; font-size: 15px; line-height: 1.5; color: #12365b"><span style="font-weight: 600">Want different measures for your county?</span><span>Reach out to <a href="mailto:research@pophealthinnovationlab.org" style="color: #496b9c; font-weight: 600">research@pophealthinnovationlab.org</a> and PHIL will work with you.</span></div>
<sc-if value="{{prof.noTopics}}" hint-placeholder-val="{{false}}">
<div class="phil-noprint" style="border: 2px dashed #73889e; border-radius: 10px; padding: 24px; font-size: 16px; font-weight: 700; color: #12365b; background: #f8fafb">Select at least one topic above to build the profile.</div>
</sc-if>
<sc-for list="{{prof.sections}}" as="sec" hint-placeholder-count="6">
<div class="{{sec.secClass}}" style="display: flex; flex-direction: column; gap: 0">
<div class="{{sec.secClass}}" style="display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; justify-content: space-between; margin: 12px 0 8px">
<h3 style="margin: 0; font-family: Archer, Georgia, Cambria, serif; font-size: 22px; color: #12365b; border-left: 5px solid #039862; padding-left: 12px">{{sec.title}}</h3>
<div class="phil-noprint" style="display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 12px; color: #526c87"><span>{{sec.countText}}</span><button type="button" onClick="{{sec.toggleAll}}" style="padding: 0; border: none; background: transparent; color: #496b9c; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; text-decoration: underline">{{sec.allOnLabel}}</button></div>
</div>
<div style="display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(90px, 0.9fr) minmax(90px, 0.9fr) minmax(0, 1.6fr); gap: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #526c87; border-bottom: 2px solid #12365b; padding: 6px 0"><span>Measure</span><span style="text-align: right; padding-right: 12px">{{prof.countyLabel}}</span><span style="text-align: right; padding-right: 12px">California</span><span>Comparison</span></div>
<sc-for list="{{sec.rows}}" as="r" hint-placeholder-count="8">
<div class="{{r.rowClass}}" style="display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(90px, 0.9fr) minmax(90px, 0.9fr) minmax(0, 1.6fr); gap: 0; align-items: center; border-bottom: 1px solid #dee3e8; padding: 8px 0; {{r.rowStyle}}">
<div style="display: flex; flex-direction: column; gap: 2px; padding-right: 12px"><span style="font-size: 14px; font-weight: 600; line-height: 1.35; color: #12365b">{{r.label}}</span><span style="font-size: 12px; color: #526c87">{{r.name}}, {{r.period}}</span><sc-if value="{{r.hasSrc}}" hint-placeholder-val="{{true}}"><a href="{{r.src}}" target="_blank" rel="noopener" style="font-size: 12px; color: #496b9c; text-decoration: underline; text-underline-offset: 2px">Source: {{r.srcName}}</a></sc-if></div>
<div style="text-align: right; padding-right: 12px; font-size: 15px; font-weight: 600; color: #12365b">{{r.val}}</div>
<div style="text-align: right; padding-right: 12px; font-size: 14px; color: #3d556e">{{r.ca}}</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: space-between"><sc-if value="{{r.hasCmp}}" hint-placeholder-val="{{true}}"><span style="{{r.cmpStyle}}">{{r.cmp}}</span></sc-if><button type="button" class="phil-noprint" onClick="{{r.toggle}}" style="{{r.toggleStyle}}">{{r.toggleLabel}}</button></div>
</div>
