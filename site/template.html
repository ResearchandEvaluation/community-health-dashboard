<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Community Health Data Dashboard | Population Health Innovation Lab</title>
<meta name="description" content="Public data on health needs and services in the 17 California counties where PHIL works, alongside PHIL's work with community partners.">
<link rel="icon" href="assets/phil-mark.png">
<style>
html,body{height:100%}body{margin:0;overflow:hidden;background:#ffffff;color:#12365b;font-family:"Avenir Next LT Pro","Avenir Next",Avenir,Arial,Helvetica,sans-serif}
a{color:#496b9c}a:hover{color:#12365b}
button:focus-visible{outline:2px solid #12365b;outline-offset:2px}
.phil-dot{width:44px;height:44px;border:none;border-radius:50%;background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.phil-dot span{display:block;width:14px;height:14px;border-radius:50%;background:#02784d;transition:transform .15s}
.phil-dot:hover{background:#f3e9d7}
.phil-dot:hover span{transform:scale(1.3)}
@media (max-width: 700px){.phil-nav{flex-wrap:nowrap !important;overflow-x:auto;padding-bottom:6px}.phil-nav button,.phil-nav span{flex-shrink:0;white-space:nowrap}.phil-navrow{flex-wrap:nowrap !important}}
@media print{nav,.phil-noprint,header{display:none !important}#phil-dash-scroll{height:auto !important;overflow:visible !important}main{padding:0 !important;max-width:none !important}.phil-print-only{display:block !important}body{background:#ffffff !important}.phil-prow{break-inside:avoid}h3{break-after:avoid}}
.phil-print-only{display:none}
</style>
<style>.phil-loading{font-family:Arial,sans-serif;padding:40px;color:#12365b}</style>
</head>
<body>
<div id="phil-root"><div class="phil-loading">Loading the Community Health Data Dashboard…</div></div>
<script type="text/template" id="phil-template">
<div id="phil-dash-scroll" style="height: 100vh; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; background: #ffffff; color: #12365b; font-family: 'Avenir Next LT Pro', 'Avenir Next', Avenir, Arial, Helvetica, sans-serif">
<div style="background: #ffffff; border-bottom: 1px solid #dee3e8; padding: 20px 24px">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between">
<a href="https://pophealthinnovationlab.org/" style="display: inline-flex; padding: 8px 0"><img src="assets/phil-logo.png" alt="Population Health Innovation Lab, a program of the Public Health Institute" style="height: 104px; width: auto; max-width: none; display: block; margin: -17px 0 -21px -20px"></a>
<span style="font-size: 13px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #526c87">Prototype for Review</span>
</div>
</div>
<header style="background: #12365b; color: #ffffff; padding: 40px 24px 32px">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px">
<h1 style="margin: 0; font-family: Archer, Georgia, Cambria, serif; font-size: 40px; line-height: 1.15; font-weight: 700; color: #ffffff">Community Health Data Dashboard</h1>
<p style="margin: 0; max-width: 820px; font-size: 17px; line-height: 1.5; color: #f3e9d7">Public data on health needs in the California communities PHIL serves, alongside how PHIL and its partners are working to improve health in each community.</p>
</div>
</header>
<nav aria-label="Dashboard sections" style="background: #f3e9d7; border-bottom: 1px solid #dee3e8; padding: 12px 24px">
<div class="phil-nav" style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #30718d; padding-left: 4px">Start here</span><div class="phil-navrow" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{tabsHome}}" as="t" hint-placeholder-count="1">
<button type="button" onClick="{{t.pick}}" aria-current="{{t.current}}" title="{{t.label}}" style="{{t.style}}">{{t.navLabel}}</button>
</sc-for>
</div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #30718d; padding-left: 4px">Health topics</span><div class="phil-navrow" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{tabsTopics}}" as="t" hint-placeholder-count="5">
<button type="button" onClick="{{t.pick}}" aria-current="{{t.current}}" title="{{t.label}}" style="{{t.style}}">{{t.navLabel}}</button>
</sc-for>
</div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #30718d; padding-left: 4px">Care and Coverage</span><div class="phil-navrow" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{tabsServices}}" as="t" hint-placeholder-count="2">
<button type="button" onClick="{{t.pick}}" aria-current="{{t.current}}" title="{{t.label}}" style="{{t.style}}">{{t.navLabel}}</button>
</sc-for>
</div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #30718d; padding-left: 4px">More</span><div class="phil-navrow" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{tabsMore}}" as="t" hint-placeholder-count="1">
<button type="button" onClick="{{t.pick}}" aria-current="{{t.current}}" title="{{t.label}}" style="{{t.style}}">{{t.navLabel}}</button>
</sc-for>
</div></div>
</div>
</nav>
<main style="max-width: 1200px; margin: 0 auto; padding: 40px 24px 64px; display: flex; flex-direction: column; gap: 48px">

<sc-if value="{{showOverview}}" hint-placeholder-val="{{true}}">
<section style="display: flex; flex-direction: column; gap: 48px">

<div style="background: #f3e9d7; border-radius: 10px; padding: 28px; display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">
<img src="assets/fox-welcome.png" alt="PHIL's fox mascot with arms open in welcome" style="height: 140px; width: auto; flex-shrink: 0">
<div style="flex: 1 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-family: Archer, Georgia, Cambria, serif; font-size: 30px; line-height: 1.2; color: #039862">About This Dashboard</h2>
<p style="margin: 0; max-width: 820px; font-size: 16px; line-height: 1.55; color: #12365b">The Community Health Data Dashboard shares public data on health needs and services in the 17 California counties where PHIL works. PHIL built it for the community partners it collaborates with, and for every organization working in these counties, to support local planning, grant writing, program design, and conversations across sectors.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px">
<div style="background: #ffffff; border-radius: 8px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.5; color: #12365b"><h3 style="margin: 0; font-size: 14px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #30718d">Why These 17 Counties</h3>
<p style="margin: 0">These are the communities where PHIL partners with community-based organizations, Tribes, health systems, Medi-Cal managed care plans, and county agencies. Together, they build collaboratives, communities of practice, and lasting systems change. PHIL contributes research and evaluation, facilitation, technical assistance, and data. Partners contribute local knowledge and leadership. The dashboard supports that shared work.</p>
</div>
<div style="background: #ffffff; border-radius: 8px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.5; color: #12365b"><h3 style="margin: 0; font-size: 14px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #30718d">Connected Through Medi-Cal</h3>
<p style="margin: 0">Under California Advancing and Innovating Medi-Cal (CalAIM), managed care plans, community-based organizations, clinics, hospitals, county agencies, and Tribes share responsibility for Medi-Cal members' health. The dashboard places county health data beside Medi-Cal coverage, Enhanced Care Management (ECM), and Community Supports data so partners can see needs and services together.</p>
</div>
<div style="background: #ffffff; border-radius: 8px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.5; color: #12365b"><h3 style="margin: 0; font-size: 14px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #30718d">What the Dashboard Covers</h3>
<p style="margin: 0">Five health topics PHIL focuses on:</p>
<ul style="margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px">
<li>Cardiovascular health</li>
<li>Adverse childhood experiences (ACEs), trauma, and resilience</li>
<li>Maternal and early childhood behavioral health</li>
<li>Youth behavioral health</li>
<li>Substance use and homelessness</li>
</ul>
<p style="margin: 0">Care and coverage: access to care, Medi-Cal, Enhanced Care Management (ECM), and Community Supports.</p>
</div>
</div>
<div style="display: none">
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h3 style="margin: 0; font-size: 14px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #30718d">Who It Is For</h3>
<ul style="margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 15px; line-height: 1.45; color: #12365b">
<li>Community-based organizations and Tribal partners</li>
<li>Clinics, hospitals, and Medi-Cal managed care plans</li>
<li>Enhanced Care Management (ECM) and Community Supports providers</li>
<li>County public health and behavioral health departments</li>
<li>Funders and policymakers</li>
<li>PHIL grantees and collaborative members</li>
</ul>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h3 style="margin: 0; font-size: 14px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #30718d">How to Use It</h3>
<ol style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; line-height: 1.45; color: #12365b">
<li><span style="font-weight: 800">Choose your county.</span> It stays selected on every page.</li>
<li><span style="font-weight: 800">Review your county at a glance:</span> headline measures compared with the California average or with all California counties.</li>
<li><span style="font-weight: 800">Open a health topic</span> for county indicators, trends, and PHIL's projects and partnerships on that topic.</li>
<li><span style="font-weight: 800">Open the Care and Coverage pages</span> for Medi-Cal coverage, access to care, Enhanced Care Management (ECM), and Community Supports in your county.</li>
<li><span style="font-weight: 800">See how PHIL engages in your community</span> and how to connect.</li>
<li><span style="font-weight: 800">Open Resources</span> for state dashboards, PHIL reports and toolkits, and the data sources behind this dashboard.</li>
</ol>
</div>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-family: Archer, Georgia, Cambria, serif; font-size: 28px; color: #039862">{{ov.pickTitle}}</h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{ov.counties}}" as="c" hint-placeholder-count="17">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" aria-label="{{c.aria}}" style="{{c.style}}">{{c.name}}</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #30718d">How to read the colors</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: #3d556e">
<span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 50%; background: #fbd5d2; border: 1px solid #b42318; display: inline-block"></span>Worse than California average</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 50%; background: #d3f0df; border: 1px solid #02784d; display: inline-block"></span>Better than California average</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 50%; background: #e8edf2; border: 1px solid #73889e; display: inline-block"></span>No California comparison, or same as the California average</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 28px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #e3f1f8, #8cc9e4 50%, #2a7fa8); display: inline-block"></span>All California counties, lowest to highest</span>
</div>
</div>
</div>

<sc-if value="{{hasCounty}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-family: Archer, Georgia, Cambria, serif; font-size: 28px; color: #039862">{{ov.countyLabel}} at a Glance</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #3d556e">Select a card to open its topic.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px">
<sc-for list="{{ov.snapshot}}" as="k" hint-placeholder-count="6">
<button type="button" onClick="{{k.pick}}" style="text-align: left; font-family: inherit; color: #12365b; cursor: pointer; background: #ffffff; border: 1px solid #dee3e8; border-radius: 10px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: #30718d">{{k.topic}}</span>
<span style="font-size: 15px; line-height: 1.35; font-weight: 700">{{k.label}}</span>
<span style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px">
<span style="font-family: Archer, Georgia, Cambria, serif; font-size: 34px; font-weight: 700; line-height: 1.1; color: #12365b">{{k.value}}</span>
<sc-if value="{{k.hasPill}}" hint-placeholder-val="{{true}}"><span style="{{k.pillStyle}}">{{k.pill}}</span></sc-if>
</span>
<sc-if value="{{k.isBars}}" hint-placeholder-val="{{true}}">
<span style="display: flex; flex-direction: column; gap: 6px; width: 100%">
<sc-for list="{{k.bars}}" as="b" hint-placeholder-count="2">
<span style="display: grid; grid-template-columns: 96px 1fr 56px; align-items: center; gap: 8px; font-size: 12px">
<span style="color: #3d556e">{{b.label}}</span>
<span style="display: block; height: 12px; background: #f4f6f8; border-radius: 4px; overflow: hidden"><span style="{{b.style}}"></span></span>
<span style="text-align: right; font-weight: 800">{{b.value}}</span>
</span>
</sc-for>
</span>
</sc-if>
<sc-if value="{{k.isRank}}" hint-placeholder-val="{{false}}">
<span style="display: flex; flex-direction: column; gap: 4px; width: 100%">
<span style="position: relative; display: block; height: 26px; margin: 0 10px" aria-hidden="true">
<span style="position: absolute; left: -6px; right: -6px; top: 9px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #e3f1f8, #8cc9e4 50%, #2a7fa8)"></span>
<sc-for list="{{k.dots}}" as="dt" hint-placeholder-count="58"><span style="{{dt.style}}"></span></sc-for>
</span>
<span style="display: flex; justify-content: space-between; font-size: 12px; color: #526c87"><span>{{k.rankLow}}</span><span>{{k.rankHigh}}</span></span>
</span>
</sc-if>
<span style="margin-top: auto; font-size: 12px; color: #526c87">{{k.period}}</span>
</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-family: Archer, Georgia, Cambria, serif; font-size: 28px; color: #039862">What Would You Like to Do?</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px">
<button type="button" onClick="{{ov.goTopics}}" style="text-align: left; border: none; cursor: pointer; font-family: inherit; width: 100%; background: #12365b; color: #ffffff; border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 8px; min-height: 140px">
<span style="font-family: Archer, Georgia, Cambria, serif; font-size: 22px; font-weight: 700; color: #ffffff">Explore Health Data by Topic</span>
<span style="font-size: 15px; line-height: 1.45; color: #f3e9d7">Five health topics, from cardiovascular health to substance use and homelessness, with county data and trends.</span>
</button>
<button type="button" onClick="{{ov.goEcm}}" style="text-align: left; border: none; cursor: pointer; font-family: inherit; background: #02784d; color: #ffffff; border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 8px; min-height: 140px">
<span style="font-family: Archer, Georgia, Cambria, serif; font-size: 22px; font-weight: 700; color: #ffffff">Care and Coverage</span>
<span style="font-size: 15px; line-height: 1.45; color: #ffffff">{{ov.ecmLine}}</span>
</button>
<button type="button" onClick="{{ov.goPhil}}" style="text-align: left; border: none; cursor: pointer; font-family: inherit; width: 100%; background: #f3e9d7; color: #12365b; border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 8px; min-height: 140px">
<span style="font-family: Archer, Georgia, Cambria, serif; font-size: 22px; font-weight: 700; color: #12365b">PHIL in the {{ov.countyLabel}} Community</span>
<span style="font-size: 15px; line-height: 1.45; color: #12365b">{{ov.philLine}}</span>
</button>
</div>
</div>

</sc-if>

<div id="ov-topics" style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; gap: 16px; align-items: center">
<img src="assets/fox-pointing.png" alt="PHIL's fox mascot pointing toward the health topics" style="height: 88px; width: auto; flex-shrink: 0">
<div style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-family: Archer, Georgia, Cambria, serif; font-size: 28px; color: #039862">Health Topics</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #3d556e">{{ov.topicsLine}}</p>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px">
<sc-for list="{{topicCards}}" as="c" hint-placeholder-count="5">
<button type="button" onClick="{{c.pick}}" style="text-align: left; background: #ffffff; border: 1px solid #73889e; border-radius: 8px; padding: 22px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; font-family: inherit; color: #12365b">
<span style="font-size: 19px; font-weight: 800; line-height: 1.3">{{c.title}}</span>
<span style="font-size: 14px; color: #3d556e">{{c.count}}</span>
<sc-if value="{{c.philHere}}" hint-placeholder-val="{{false}}"><span style="align-self: flex-start; display: inline-block; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 800; background: #b8d876; color: #12365b">PHIL works on this here</span></sc-if>
</button>
</sc-for>
</div>
</div>

<div id="ov-care" style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-family: Archer, Georgia, Cambria, serif; font-size: 28px; color: #039862">Care and Coverage</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #3d556e">How people in the county get care through Medi-Cal and the wider health system.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px">
<sc-for list="{{careCards}}" as="c" hint-placeholder-count="2">
<button type="button" onClick="{{c.pick}}" style="text-align: left; background: #ffffff; border: 1px solid #73889e; border-radius: 8px; padding: 22px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; font-family: inherit; color: #12365b">
<span style="font-size: 19px; font-weight: 800; line-height: 1.3">{{c.title}}</span>
<span style="font-size: 14px; color: #3d556e">{{c.count}}</span>
<sc-if value="{{c.philHere}}" hint-placeholder-val="{{false}}"><span style="align-self: flex-start; display: inline-block; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 800; background: #b8d876; color: #12365b">PHIL works on this here</span></sc-if>
</button>
</sc-for>
</div>
</div>

<sc-if value="{{hasCounty}}" hint-placeholder-val="{{true}}">
<div id="ov-phil" style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-family: Archer, Georgia, Cambria, serif; font-size: 28px; color: #039862">How PHIL Engages in the {{ov.countyLabel}} Community</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #3d556e">{{ov.philIntro}}</p>
</div>
<sc-if value="{{ov.hasPhil}}" hint-placeholder-val="{{true}}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px">
<sc-for list="{{ov.philWork}}" as="w" hint-placeholder-count="3">
<div style="background: #ffffff; border: 1px solid #dee3e8; border-left: 4px solid #b8d876; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px; font-weight: 800; color: #02784d">{{w.years}}</div>
<div style="font-size: 17px; line-height: 1.35; font-weight: 800; color: #12365b"><sc-if value="{{w.hasUrl}}" hint-placeholder-val="{{true}}"><a href="{{w.url}}" target="_blank" rel="noopener" style="color: inherit; text-decoration: underline; text-decoration-color: #b8d876; text-underline-offset: 3px">{{w.name}}</a></sc-if><sc-if value="{{w.noUrl}}" hint-placeholder-val="{{false}}">{{w.name}}</sc-if></div>
<div style="font-size: 14px; line-height: 1.5; color: #12365b">{{w.role}}</div>
<div style="font-size: 13px; color: #3d556e">Where: {{w.where}}</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{w.topics}}" as="t" hint-placeholder-count="2">
<button type="button" onClick="{{t.pick}}" style="min-height: 32px; padding: 4px 10px; border-radius: 999px; border: 1px solid #b8d876; background: #f6faec; color: #12365b; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer">{{t.title}}</button>
</sc-for>
</div>
</div>
</sc-for>
</div>
</sc-if>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #12365b">To connect with PHIL about work in your county, visit <a href="https://pophealthinnovationlab.org/">pophealthinnovationlab.org</a>.</p>
</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-family: Archer, Georgia, Cambria, serif; font-size: 24px; color: #039862">How PHIL's Work Connects Across Topics</h2>

<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.5; color: #12365b">
<li>{{sourceSummary}}</li>
<li>Every value is published by its data source. PHIL does not calculate its own rates or statewide figures.</li>
<li>PHIL ranks the published county values from highest to lowest, and marks whether a higher value is better or worse for each measure. These rankings and colors are the only things PHIL adds.</li>
<li>Census estimates come from a survey and are published with a margin of error, shown as ±. The true value is likely within that range.</li>
<li>The dashboard compares a county with California only when one dataset publishes both values. Otherwise, it shows the county's rank among California counties or the county value alone.</li>
<li>"Suppressed" means the publisher withheld a small number to protect privacy. Some publishers report small counties as a combined group, and the dashboard shows those groups as published.</li>
<li>Each chart shows the years its data covers. The dashboard updates on a regular schedule as publishers release new data.</li>
</ul>
